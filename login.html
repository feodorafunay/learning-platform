<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — RuangBelajar</title><meta name="theme-color" content="#2f6f66"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f6f66'/%3E%3Ctext x='32' y='45' font-size='38' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='white'%3ER%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"><link rel="stylesheet" href="assets/style.css"></head>
<body>
<header class="navbar-shell"><div class="container navbar">
<a class="brand" href="index.html"><span class="brand-mark">R</span><span>RuangBelajar<small>Learning Platform</small></span></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="resources.html">Resources</a><a href="register.html" class="btn btn-primary btn-small" data-auth="guest">Daftar</a><a href="profile-student.html" data-auth="member" data-profile-link hidden>Profil</a><button type="button" class="btn btn-secondary btn-small" data-auth="member" data-logout hidden>Keluar</button></nav>
<div class="nav-actions"><button class="lang-toggle" data-lang-toggle>EN</button><button class="mobile-toggle">☰</button></div>
</div></header>

<main class="auth-wrap">
<div class="container" style="display:flex;justify-content:center">
<div class="auth-card">
<span class="eyebrow">Account</span>
<h1 data-i18n="login">Masuk</h1>
<p>Masuk untuk melanjutkan perjalanan belajar dan berkomunikasi dengan guru.</p>
<form id="loginForm">
<div class="form-grid">
<div class="form-group full"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" inputmode="email" required placeholder="nama@email.com"></div>
<div class="form-group full"><label for="login-pass">Password</label><input id="login-pass" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
<div class="form-group full">
<div class="label-text">Simulasi role</div>
<div class="choice-row">
<label class="choice"><input type="radio" name="demoRole" value="student" checked><span><strong>Murid</strong><br><small class="field-help">Masuk sebagai murid untuk melihat dashboard pembelajaran.</small></span></label>
<label class="choice"><input type="radio" name="demoRole" value="teacher"><span><strong>Guru</strong><br><small class="field-help">Masuk sebagai guru untuk melihat murid dan review tugas.</small></span></label>
</div>
</div>
<div class="form-group full"><button class="btn btn-primary" type="submit">Masuk</button></div>
</div>
</form>
<p style="margin:18px 0 0;font-size:.82rem">Belum punya akun? <a href="register.html" style="color:var(--primary);font-weight:700">Daftar sekarang</a></p>
</div>
</div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
